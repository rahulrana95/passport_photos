<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Passport Photo Checker">
  <!--
    The tab icon. Colours are literals because an SVG asset cannot read the
    document's CSS custom properties; #0e6e62 is --tk-accent and #ffffff is
    --tk-accent-contrast, and they must be changed together with tokens.css.

    Deliberately two shapes and no check mark: at 16px a third element turns
    the whole mark to mud. A head in a frame reads as an ID photo at any size.
  -->
  <rect width="32" height="32" rx="7" fill="#0e6e62"/>
  <circle cx="16" cy="12.5" r="4.75" fill="#ffffff"/>
  <path d="M16 18.75c-4.6 0-8.35 3.1-8.35 6.9V27h16.7v-1.35c0-3.8-3.75-6.9-8.35-6.9Z" fill="#ffffff"/>
</svg>
