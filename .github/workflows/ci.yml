name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs so a stale job never blocks a merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Chromium is provisioned by the Playwright action; never re-download it.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"

  # The build refuses to run without an origin, deliberately: a missing one
  # silently produces relative canonicals and de-indexes the site. CI has no
  # deployment to derive one from, so it supplies its own. A reserved .invalid
  # host (RFC 2606) is absolute enough for the SEO assertions and impossible to
  # mistake for something deployable — unlike a placeholder domain someone
  # might later believe was real.
  NEXT_PUBLIC_SITE_URL: https://ci.invalid

jobs:
  # The application does not exist until PR #2. Every job below is guarded on
  # package.json so this workflow is valid and green from PR #1 onward, and
  # activates automatically the moment the scaffold lands.
  detect:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.check.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f package.json ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet — application jobs skipped (expected until PR #2)."
          fi

  verify:
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests and coverage gate
        # Thresholds live in the Vitest config at 100%. This step fails, it does
        # not warn, when coverage drops below them.
        run: npm run test:unit -- --coverage
      - name: Build
        run: npm run build
      - name: Validate photo specifications
        # Every value is a claim about a government requirement. The registry
        # parses each spec at module load and throws, so a malformed or
        # unsourced one stops the deploy rather than surfacing as a wrong
        # number on a live page.
        run: npm run validate:specs
      - name: Assert static HTML contains real content
        # Guards the core SEO invariant: what should rank must be server-rendered.
        run: npm run test:seo

  visual:
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit
      - name: Integration tests and story screenshots
        # One command, both projects. test:e2e builds Storybook first because
        # the Playwright config serves storybook-static for every project, not
        # only the stories one — running the app specs alone still needs it.
        #
        # This is also the gate on the screenshots themselves: every story, in
        # every theme and viewport, compared against its committed baseline. A
        # UI change cannot land without a human looking at the diff.
        run: npm run test:e2e
      - name: Screenshot gallery is in sync
        # The gallery is generated. If a baseline was added or removed without
        # regenerating it, the browsable index silently stops matching reality.
        run: |
          npm run screenshots:gallery
          git diff --exit-code e2e/visual/SCREENSHOTS.md
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-artifacts
          # test-results/ carries the actual-vs-expected screenshot pairs, which
          # is the whole point of the artifact on a visual failure.
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  budgets:
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse budgets (desktop)
        run: npm run test:lighthouse
      # A separate run rather than more URLs on the first, because the two
      # profiles need different thresholds: desktop lands around 550ms and
      # throttled mobile around 1.7s, and one set of limits loose enough for
      # both would stop the desktop run catching anything. Mobile is where
      # this product's traffic actually is.
      - name: Lighthouse budgets (throttled mobile)
        run: npm run test:lighthouse:mobile
